name: Update tools

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
      - name: Upgrade dependencies
        run: |
          uv lock --upgrade
          uv sync
      - uses: ./.github/actions/setup-dprint # zizmor: ignore[self-repository] — actionlint rejects $/
      - name: Bump hook revs and dprint plugins
        run: |
          uv run prek autoupdate
          dprint config update
      - name: Auto-fix and verify
        run: |
          uv run prek run -a || uv run prek run -a --show-diff-on-failure
      - name: Run tests
        run: uv run pytest --no-cov -x -q
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # PAT scopes: contents, pull-requests, workflows
          token: ${{ secrets.AUTOUPDATE_TOKEN }}
          commit-message: "chore: update dependencies and dev tools"
          branch: autoupdate-tools
          title: "chore: update dependencies and dev tools"
          body: Automated update of uv dependencies, prek hook revs, and dprint plugins.
          delete-branch: true
